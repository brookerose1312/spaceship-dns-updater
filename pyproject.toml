[project]
name = "spaceship-dns-updater"
version = "1.0.0"
description = "Dynamic DNS updater for Spaceship"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["requests>=2.28,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "D",
    "INP001",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "S108",
]
